# 本地开发配置 - 不需要 Cloudflare 账户
# 使用 wrangler dev --local 模式运行

name = "cloud-mail-local"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = false

[dev]
ip = "0.0.0.0"
# 本地模式下，D1 数据库会创建在 .wrangler/state/v3/d1 目录下
# KV 会存储在 .wrangler/state/v3/kv 目录下

# 本地模式下的 D1 数据库配置
# 不需要真实的 database_id，Wrangler 会在本地创建 SQLite 文件
[[d1_databases]]
binding = "db"
database_name = "email-local"
# 本地模式下可以留空或使用任意 ID
database_id = "local-dev-db-id"

# 本地模式下的 KV 配置
# 不需要真实的 KV id，Wrangler 会在本地创建 KV 存储
[[kv_namespaces]]
binding = "kv"
# 本地模式下可以留空或使用任意 ID
id = "local-dev-kv-id"

# R2 本地存储（可选，如果不需要附件功能可以注释掉）
#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email-local"

[vars]
orm_log = false
# 配置测试用的域名（可以是任意域名，仅用于测试）
domain = ["test.local", "example.local"]
# 配置测试用的管理员邮箱
admin = "admin@test.local"
# JWT 密钥（可以是任意字符串）
jwt_secret = "local-dev-jwt-secret-key-12345"
casdoor_server_url = "https://casdoor.ruawd.de"
casdoor_client_id = ""
casdoor_client_secret = ""
casdoor_callback_url = ""
casdoor_switch = false
